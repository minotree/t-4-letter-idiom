<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>한자 카드 시제품</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; font-family: system-ui, sans-serif; color: #183c30; background: #f5f7f4; }
    main { max-width: 560px; margin: auto; }
    .card { background: #224d40; color: white; text-align: center; padding: 20px; border-radius: 16px; }
    .card small { opacity: .8; }
    .characters { display: flex; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
    .characters button { border: 0; background: transparent; color: #edc574; font: 42px Batang, serif; cursor: pointer; min-width: 48px; padding: 0 2px; }
    button:focus-visible, a:focus-visible { outline: 3px solid #d9901a; outline-offset: 2px; }
    .note { color: #4b665a; line-height: 1.5; }
    dialog { width: min(92vw, 420px); max-height: min(90dvh, 750px); border: 0; border-radius: 16px; padding: 22px; color: #183c30; overflow: auto; }
    dialog::backdrop { background: #0009; }
    .dialog-heading { display: flex; align-items: flex-start; justify-content: space-between; }
    h2 { margin: 0; font: 48px Batang, serif; }
    .close { border: 0; background: #e6eee8; border-radius: 8px; padding: 10px 13px; cursor: pointer; }
    dl { display: grid; grid-template-columns: 72px 1fr; gap: 10px; line-height: 1.5; }
    dt { color: #60766b; } dd { margin: 0; }
    .stroke { border-top: 1px solid #d8e1db; padding-top: 12px; }
    .stroke h3 { font-size: 16px; margin: 0; }
    object { display: block; width: 160px; height: 160px; max-width: 100%; margin: 0 auto; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .controls button { border: 0; border-radius: 8px; background: #e6eee8; color: #183c30; padding: 9px 12px; cursor: pointer; }
    .sources { font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <p class="note">시제품 · 한자 정보를 확인 중입니다.</p>
  <section class="card" aria-label="현재 한자성어">
    <small>이음의 시작</small>
    <div class="characters" aria-label="한자 정보 보기">
      <button type="button" data-character="羲" aria-label="羲 한자 정보">羲</button>
      <button type="button" data-character="暉" aria-label="暉 한자 정보">暉</button>
      <button type="button" data-character="朗" aria-label="朗 한자 정보">朗</button>
      <button type="button" data-character="曜" aria-label="曜 한자 정보">曜</button>
    </div>
    <strong>희휘낭요</strong>
    <p><small>출처: 천자문</small></p>
  </section>
  <p class="note">한자를 눌러 정보를 살펴보세요.</p>
</main>
<dialog aria-labelledby="character-title">
  <div class="dialog-heading"><h2 id="character-title"></h2><button class="close" type="button" aria-label="한자 정보 닫기">닫기</button></div>
  <dl><dt>훈음</dt><dd id="reading"></dd><dt>부수</dt><dd id="radical"></dd><dt>총획수</dt><dd id="strokes"></dd></dl>
  <section class="stroke" aria-labelledby="stroke-title"><h3 id="stroke-title">획순</h3><p id="stroke-note" class="note"></p><div id="animation"></div><div id="controls" class="controls" hidden><button type="button" data-action="play">재생</button><button type="button" data-action="pause">일시정지</button><button type="button" data-action="restart">다시 보기</button></div></section>
  <p id="dictionary-source" class="sources"></p>
  <p class="sources" id="animation-source" hidden>획순 참고 자료: AnimCJK, Arphic Public License · <a href="COPYING.txt">저작권 고지</a> · <a href="ARPHICPL.TXT">라이선스 전문</a></p>
</dialog>
<script>
  const facts = {
    '羲': { reading: '숨 희 · 복희 희', radical: '羊 (양 양)', strokes: '16획', svg: '32690-zhhans.svg', region: '중국', source: 'https://github.com/libhangul/libhangul/blob/23d2cd9d10d516d523d60c562dbcc7ea08139a09/data/hanja/hanja.txt', sourceName: 'libhangul 한자 사전', sourceLicense: 'BSD 3-Clause', reference: 'https://encykorea.aks.ac.kr/Article/E0066119' },
    '暉': { reading: '빛 휘 · 햇빛 휘', radical: '日 (날 일)', strokes: '13획', svg: '26249-ja.svg', region: '일본', source: 'https://github.com/libhangul/libhangul/blob/23d2cd9d10d516d523d60c562dbcc7ea08139a09/data/hanja/hanja.txt', sourceName: 'libhangul 한자 사전', sourceLicense: 'BSD 3-Clause', reference: 'https://encykorea.aks.ac.kr/Article/E0042716' },
    '朗': { reading: '밝을 랑 · 밝을 낭', radical: '月 (달 월)', strokes: '11획 (한국어기초사전 기준)', svg: '26391.svg', source: 'https://krdict.korean.go.kr/eng/dicSearch/SearchView?ParaWordNo=41252', radicalSource: 'https://krdict.korean.go.kr/kor/dicSearch/SearchView?ParaWordNo=26894' },
    '曜': { reading: '빛날 요', radical: '日 (날 일)', strokes: '18획', svg: '26332.svg', source: 'https://krdict.korean.go.kr/kor/dicSearch/SearchView?ParaWordNo=67865' }
  };
  const dialog = document.querySelector('dialog');
  const animation = document.querySelector('#animation');
  const controls = document.querySelector('#controls');
  let opener = null;
  let currentFile = null;
  function loadAnimation() {
    animation.replaceChildren();
    if (!currentFile) return;
    const object = document.createElement('object');
    object.type = 'image/svg+xml';
    object.data = currentFile;
    object.setAttribute('aria-label', '획순 참고 애니메이션');
    animation.append(object);
  }
  function changePlayback(state) {
    animation.querySelector('object')?.contentDocument?.querySelectorAll('path[clip-path]').forEach(path => { path.style.animationPlayState = state; });
  }
  document.querySelectorAll('[data-character]').forEach(button => button.addEventListener('click', () => {
    opener = button;
    const character = button.dataset.character;
    const fact = facts[character];
    document.querySelector('#character-title').textContent = character;
    document.querySelector('#reading').textContent = fact.reading || '정보 준비 중';
    document.querySelector('#radical').textContent = fact.radical || '정보 준비 중';
    document.querySelector('#strokes').textContent = fact.strokes || '정보 준비 중';
    currentFile = fact.svg || null;
    document.querySelector('#stroke-note').textContent = currentFile ? `${fact.region ? `${fact.region} 자료의 ` : ''}참고용 획순입니다. 한국 학습 기준 대조를 진행 중이에요.` : '획순 준비 중';
    controls.hidden = !currentFile;
    document.querySelector('#animation-source').hidden = !currentFile;
    const source = document.querySelector('#dictionary-source');
    source.replaceChildren();
    if (fact.source) {
      source.append(fact.reference ? '훈음 출처: ' : '훈음·부수·획수 출처: ');
      const link = document.createElement('a'); link.href = fact.source; link.textContent = fact.sourceName || '국립국어원 한국어기초사전'; link.target = '_blank'; link.rel = 'noopener noreferrer'; source.append(link);
      if (fact.radicalSource) {
        source.append(' · ');
        const radicalLink = document.createElement('a'); radicalLink.href = fact.radicalSource; radicalLink.textContent = '부수 훈음 출처'; radicalLink.target = '_blank'; radicalLink.rel = 'noopener noreferrer'; source.append(radicalLink);
      }
      if (fact.reference) {
        source.append(` (${fact.sourceLicense})`);
        source.append(' · ');
        const referenceLink = document.createElement('a'); referenceLink.href = fact.reference; referenceLink.textContent = '부수·획수 대조'; referenceLink.target = '_blank'; referenceLink.rel = 'noopener noreferrer'; source.append(referenceLink);
      }
      if (!fact.reference) source.append(' · CC BY-SA 2.0 대한민국');
    }
    loadAnimation();
    dialog.showModal();
    dialog.querySelector('.close').focus();
  }));
  dialog.querySelector('.close').addEventListener('click', () => dialog.close());
  dialog.addEventListener('close', () => { animation.replaceChildren(); currentFile = null; opener?.focus(); });
  controls.addEventListener('click', event => {
    const action = event.target.closest('button')?.dataset.action;
    if (action === 'play') changePlayback('running');
    if (action === 'pause') changePlayback('paused');
    if (action === 'restart') loadAnimation();
  });
</script>
</body>
</html>
